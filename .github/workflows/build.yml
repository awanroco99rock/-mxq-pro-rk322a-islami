name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Buat Struktur Project Otomatis
        run: |
          rm -f build.gradle settings.gradle
          mkdir -p app/src/main/java/com/mxq/islami/launcher
          mkdir -p app/src/main/res/layout
          
          cat > settings.gradle << 'EOF'
          include ':app'
          EOF
          
          cat > build.gradle << 'EOF'
          // Top-level build file
          task clean(type: Delete) {
              delete rootProject.buildDir
          }
          EOF
          
          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.1.4' apply true
          }
          android {
              compileSdk 33
              namespace "com.mxq.islami.launcher"
              defaultConfig {
                  applicationId "com.mxq.islami.launcher"
                  minSdk 21
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.4.2'
          }
          EOF
          
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:label="Islami MXQ">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.HOME"/>
                  <category android:name="android.intent.category.DEFAULT"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          
          cp IslamiLauncher/MainActivity.java app/src/main/java/com/mxq/islami/launcher/ 2>/dev/null || echo "package com.mxq.islami.launcher; import android.app.Activity; import android.os.Bundle; public class MainActivity extends Activity { protected void onCreate(Bundle b){super.onCreate(b);} }" > app/src/main/java/com/mxq/islami/launcher/MainActivity.java
          cp IslamiLauncher/layout_activity_main.xml app/src/main/res/layout/activity_main.xml 2>/dev/null || echo '<?xml version="1.0"?><LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent"><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Islami Launcher"/></LinearLayout>' > app/src/main/res/layout/activity_main.xml

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Islami-MXQ-PRO-APK
          path: app/build/outputs/apk/debug/*.apk
