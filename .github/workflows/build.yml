name: Build MXQ Pro RK322A Islami APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Clean Gradle Configuration
        run: |
          rm -f settings.gradle settings.gradle.kts
          rm -f build.gradle build.gradle.kts
          rm -f app/build.gradle app/build.gradle.kts
          mkdir -p app/src/main/java/com/mxq/islami/launcher
          mkdir -p app/src/main/res/layout

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "mxq-pro-rk322a-islami"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          tasks.register('clean', Delete) {
              delete rootProject.layout.buildDirectory
          }
          EOF

      - name: Create App Gradle Configuration
        run: |
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.1.4'
          }
          android {
              namespace 'com.mxq.islami.launcher'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.mxq.islami.launcher'
                  minSdk 21
                  targetSdk 28
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

      - name: Copy MainActivity
        run: |
          SOURCE=$(find IslamiLauncher -type f -name "*.java" | head -n 1)
          echo "Source: $SOURCE"
          cp "$SOURCE" app/src/main/java/com/mxq/islami/launcher/MainActivity.java
          # hapus package lama biar tidak dobel
          sed -i '/^package/d' app/src/main/java/com/mxq/islami/launcher/MainActivity.java
          sed -i '1i package com.mxq.islami.launcher;' app/src/main/java/com/mxq/islami/launcher/MainActivity.java

      - name: Copy Layout
        run: |
          LAYOUT=$(find IslamiLauncher -type f -name "*.xml" | head -n 1)
          if [ -n "$LAYOUT" ]; then
            cp "$LAYOUT" app/src/main/res/layout/activity_main.xml
          else
            echo '<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent"/>' > app/src/main/res/layout/activity_main.xml
          fi

      - name: Create Android Manifest
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="MXQ Pro Islami"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MXQ-Pro-RK322A-Islami-APK
          path: app/build/outputs/apk/debug/app-debug.apk
