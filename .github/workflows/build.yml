name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: HAPUS file lama yang bikin merah + Buat baru
        run: |
          rm -rf settings.gradle settings.gradle.kts build.gradle build.gradle.kts .gradle
          rm -rf app/build.gradle app/build.gradle.kts
          echo "include ':app'" > settings.gradle
          echo "task clean(type: Delete) { delete rootProject.buildDir }" > build.gradle
          mkdir -p app/src/main/java/com/mxq/islami/launcher
          mkdir -p app/src/main/res/layout
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.1.4' }
          android {
              namespace 'com.mxq.islami.launcher'
              compileSdk 34
              defaultConfig {
                  applicationId "com.mxq.islami.launcher"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="Islami MXQ PRO">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                          <category android:name="android.intent.category.HOME"/>
                          <category android:name="android.intent.category.DEFAULT"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          if [ -f IslamiLauncher/MainActivity.java ]; then cp IslamiLauncher/MainActivity.java app/src/main/java/com/mxq/islami/launcher/MainActivity.java; fi
          if [ -f app/src/main/java/com/mxq/islami/launcher/MainActivity.java ]; then echo "MainActivity ketemu"; else echo 'package com.mxq.islami.launcher; import android.app.Activity; import android.os.Bundle; public class MainActivity extends Activity { protected void onCreate(Bundle b){ super.onCreate(b); } }' > app/src/main/java/com/mxq/islami/launcher/MainActivity.java; fi

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Islami-MXQ-PRO-FIX
          path: app/build/outputs/apk/debug/*.apk
