
name: MXQ Pro Islami Launcher V3 Black Gold

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Gradle 8.5
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      # 4. Create Gradle Project
      - name: Create Project Configuration
        shell: bash
        run: |
          set -e

          rm -f settings.gradle settings.gradle.kts
          rm -f build.gradle build.gradle.kts
          rm -rf app

          mkdir -p app/src/main/java/com/mxq/islami/launcher/v3

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "mxq-pro-rk322a-islami"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          tasks.register('clean', Delete) {
              delete rootProject.layout.buildDirectory
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

      # 5. App Configuration
      - name: Create App Configuration
        run: |
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.1.4'
          }

          android {
              namespace 'com.mxq.islami.launcher.v3'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.mxq.islami.launcher.v3'
                  minSdk 21
                  targetSdk 22
                  versionCode 3
                  versionName '3.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

      # 6. Main Activity
      - name: Create MainActivity
        run: |
          cat > app/src/main/java/com/mxq/islami/launcher/v3/MainActivity.java <<'EOF'
          package com.mxq.islami.launcher.v3;

          import android.app.Activity;
          import android.os.Bundle;
          import android.os.Handler;
          import android.content.Intent;
          import android.content.pm.PackageInfo;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.GridLayout;

          import org.json.JSONObject;

          import java.net.URL;
          import java.net.HttpURLConnection;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;
          import java.util.List;

          public class MainActivity extends Activity {

              private final int BLACK = Color.rgb(12, 12, 14);
              private final int PANEL = Color.rgb(27, 26, 29);
              private final int GOLD = Color.rgb(218, 178, 90);
              private final int WHITE = Color.WHITE;
              private final int MUTED = Color.rgb(180, 174, 160);

              private TextView clock;
              private TextView date;
              private TextView hijri;
              private TextView prayer;
              private Handler handler = new Handler();

              private final Runnable clockRunnable = new Runnable() {
                  @Override
                  public void run() {
                      if (clock != null) {
                          clock.setText(new SimpleDateFormat(
                              "HH:mm:ss", Locale.getDefault()
                          ).format(new Date()));
                      }
                      handler.postDelayed(this, 1000);
                  }
              };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().setStatusBarColor(BLACK);
                  getWindow().setNavigationBarColor(BLACK);

                  buildInterface();
                  loadPrayerTimes();
              }

              private GradientDrawable background(int color) {
                  GradientDrawable d = new GradientDrawable();
                  d.setColor(color);
                  d.setCornerRadius(18);
                  d.setStroke(2, GOLD);
                  return d;
              }

              private TextView text(String value, int size, int color) {
                  TextView t = new TextView(this);
                  t.setText(value);
                  t.setTextSize(size);
                  t.setTextColor(color);
                  t.setGravity(Gravity.CENTER);
                  return t;
              }

              private LinearLayout vertical() {
                  LinearLayout l = new LinearLayout(this);
                  l.setOrientation(LinearLayout.VERTICAL);
                  return l;
              }

              private LinearLayout horizontal() {
                  LinearLayout l = new LinearLayout(this);
                  l.setOrientation(LinearLayout.HORIZONTAL);
                  l.setGravity(Gravity.CENTER);
                  return l;
              }

              private LinearLayout.LayoutParams params(
                  int width, int height, float weight) {
                  return new LinearLayout.LayoutParams(
                      width, height, weight
                  );
              }

              private void buildInterface() {

                  ScrollView scroll = new ScrollView(this);
                  scroll.setBackgroundColor(BLACK);

                  LinearLayout root = vertical();
                  root.setPadding(30, 22, 30, 28);

                  scroll.addView(root);

                  TextView brand = text(
                      "✦  MXQ PRO ISLAMI  ✦",
                      24, GOLD
                  );
                  brand.setTypeface(null, Typeface.BOLD);
                  root.addView(brand, params(-1, 55, 0));

                  clock = text("--:--:--", 68, GOLD);
                  clock.setTypeface(null, Typeface.BOLD);
                  root.addView(clock, params(-1, 95, 0));

                  date = text(
                      new SimpleDateFormat(
                          "EEEE, dd MMMM yyyy",
                          new Locale("id", "ID")
                      ).format(new Date()),
                      19, WHITE
                  );
                  root.addView(date, params(-1, 35, 0));

                  hijri = text("Kalender Hijriah: Memuat...", 16, MUTED);
                  root.addView(hijri, params(-1, 32, 0));

                  TextView heading = text(
                      "JADWAL SHOLAT - BEKASI",
                      21, GOLD
                  );
                  heading.setTypeface(null, Typeface.BOLD);
                  heading.setPadding(0, 20, 0, 12);
                  root.addView(heading);

                  prayer = text(
                      "Memuat jadwal sholat...",
                      17, WHITE
                  );
                  prayer.setPadding(10, 20, 10, 20);
                  prayer.setBackground(background(PANEL));
                  root.addView(prayer, params(-1, 95, 0));

                  TextView menuTitle = text(
                      "MENU ISLAMI",
                      21, GOLD
                  );
                  menuTitle.setTypeface(null, Typeface.BOLD);
                  menuTitle.setPadding(0, 24, 0, 12);
                  root.addView(menuTitle);

                  LinearLayout menus = horizontal();

                  addMenu(menus, "AL-QUR'AN", 0);
                  addMenu(menus, "APLIKASI", 1);
                  addMenu(menus, "PENGATURAN", 2);

                  root.addView(menus, params(-1, 85, 0));

                  TextView appsTitle = text(
                      "APLIKASI TERPASANG",
                      20, GOLD
                  );
                  appsTitle.setTypeface(null, Typeface.BOLD);
                  appsTitle.setPadding(0, 25, 0, 12);
                  root.addView(appsTitle);

                  GridLayout apps = new GridLayout(this);
                  apps.setColumnCount(4);
                  apps.setAlignmentMode(GridLayout.ALIGN_MARGINS);
                  root.addView(apps, params(-1, -2, 0));

                  loadApps(apps);

                  TextView footer = text(
                      "MXQ PRO RK322A  •  BLACK GOLD EDITION  •  V3",
                      12, MUTED
                  );
                  footer.setPadding(0, 30, 0, 10);
                  root.addView(footer);

                  setContentView(scroll);
                  handler.post(clockRunnable);
              }

              private void addMenu(
                  LinearLayout parent, String label, int action) {

                  Button b = new Button(this);
                  b.setText(label);
                  b.setTextColor(GOLD);
                  b.setTextSize(13);
                  b.setAllCaps(false);
                  b.setBackground(background(PANEL));
                  b.setFocusable(true);

                  b.setOnClickListener(v -> {
                      if (action == 0) {
                          openQuran();
                      } else if (action == 1) {
                          Intent i = new Intent(
                              Intent.ACTION_MAIN,
                              null
                          );
                          i.addCategory(
                              Intent.CATEGORY_LAUNCHER
                          );
                          startActivity(
                              Intent.createChooser(i, "Pilih aplikasi")
                          );
                      } else {
                          startActivity(
                              new Intent(
                                  android.provider.Settings.ACTION_SETTINGS
                              )
                          );
                      }
                  });

                  LinearLayout.LayoutParams p =
                      new LinearLayout.LayoutParams(0, 68, 1);

                  p.setMargins(7, 4, 7, 4);
                  parent.addView(b, p);
              }

              private void openQuran() {
                  try {
                      Intent i = new Intent(
                          Intent.ACTION_VIEW,
                          android.net.Uri.parse("https://quran.com")
                      );
                      startActivity(i);
                  } catch (Exception e) {
                      prayer.setText(
                          "Browser tidak ditemukan di perangkat."
                      );
                  }
              }

              private void loadApps(GridLayout grid) {

                  PackageManager pm = getPackageManager();
                  Intent intent = new Intent(
                      Intent.ACTION_MAIN, null
                  );
                  intent.addCategory(Intent.CATEGORY_LAUNCHER);

                  List<android.content.pm.ResolveInfo> list =
                      pm.queryIntentActivities(intent, 0);

                  int count = 0;

                  for (android.content.pm.ResolveInfo info : list) {

                      String packageName =
                          info.activityInfo.packageName;

                      if (packageName.equals(getPackageName())) {
                          continue;
                      }

                      Button b = new Button(this);
                      b.setText(
                          info.loadLabel(pm).toString()
                      );
                      b.setTextSize(12);
                      b.setTextColor(WHITE);
                      b.setAllCaps(false);
                      b.setBackground(background(PANEL));
                      b.setFocusable(true);

                      b.setOnClickListener(v -> {
                          Intent launch =
                              pm.getLaunchIntentForPackage(packageName);

                          if (launch != null) {
                              startActivity(launch);
                          }
                      });

                      GridLayout.LayoutParams p =
                          new GridLayout.LayoutParams();

                      p.width = 0;
                      p.height = 90;
                      p.columnSpec =
                          GridLayout.spec(
                              GridLayout.UNDEFINED, 1f
                          );
                      p.setMargins(5, 5, 5, 5);

                      grid.addView(b, p);
                      count++;
                  }

                  if (count == 0) {
                      TextView empty = text(
                          "Belum ada aplikasi ditemukan",
                          14, MUTED
                      );
                      grid.addView(empty);
                  }
              }

              private void loadPrayerTimes() {

                  new Thread(() -> {
                      HttpURLConnection connection = null;

                      try {
                          URL url = new URL(
                              "https://api.aladhan.com/v1/timings"
                              + "?latitude=-6.2349"
                              + "&longitude=106.9896"
                              + "&method=20"
                          );

                          connection =
                              (HttpURLConnection) url.openConnection();

                          connection.setConnectTimeout(12000);
                          connection.setReadTimeout(12000);
                          connection.setRequestMethod("GET");

                          JSONObject result = new JSONObject(
                              new String(
                                  connection.getInputStream().readAllBytes(),
                                  "UTF-8"
                              )
                          );

                          JSONObject data =
                              result.getJSONObject("data");

                          JSONObject times =
                              data.getJSONObject("timings");

                          JSONObject hijriDate =
                              data.getJSONObject("date")
                                  .getJSONObject("hijri");

                          String schedule =
                              "SUBUH  " + times.getString("Fajr")
                              + "     DZUHUR  " + times.getString("Dhuhr")
                              + "\nASHAR  " + times.getString("Asr")
                              + "     MAGHRIB  " + times.getString("Maghrib")
                              + "\nISYA  " + times.getString("Isha");

                          String hijriText =
                              hijriDate.getString("day") + " "
                              + hijriDate.getJSONObject("month")
                                  .getString("en") + " "
                              + hijriDate.getString("year") + " H";

                          runOnUiThread(() -> {
                              prayer.setText(schedule);
                              hijri.setText(
                                  "Kalender Hijriah: " + hijriText
                              );
                          });

                      } catch (Exception e) {
                          runOnUiThread(() -> {
                              prayer.setText(
                                  "Jadwal belum tersedia.\n"
                                  + "Periksa koneksi internet STB."
                              );
                              hijri.setText(
                                  "Kalender Hijriah memerlukan internet."
                              );
                          });
                      } finally {
                          if (connection != null) {
                              connection.disconnect();
                          }
                      }

                  }).start();
              }

              @Override
              protected void onDestroy() {
                  handler.removeCallbacks(clockRunnable);
                  super.onDestroy();
              }
          }
          EOF

      # 7. Android Manifest
      - name: Create Android Manifest
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:label="MXQ PRO ISLAMI V3"
                  android:usesCleartextTraffic="false"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:screenOrientation="landscape">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>
          </manifest>
          EOF

      # 8. Build APK
      - name: Build Debug APK
        run: |
          gradle --version
          gradle clean
          gradle assembleDebug --no-daemon --stacktrace

      # 9. Verify APK
      - name: Verify APK
        run: |
          set -e
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p release
          cp "$APK" release/MXQ-Pro-Islami-Launcher-V3.apk
          ls -lh release/MXQ-Pro-Islami-Launcher-V3.apk

      # 10. Upload APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MXQ-Pro-Islami-Launcher-V3-BLACK-GOLD
          path: release/MXQ-Pro-Islami-Launcher-V3.apk
          if-no-files-found: error
          retention-days: 30
