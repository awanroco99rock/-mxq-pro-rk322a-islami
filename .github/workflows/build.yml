name: mxq-pro-rk322a-islami
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Buat Project Launcher V2
        run: |
          mkdir -p app/src/main/java/com/mxq/islami/launcher/v2
          
          # 1. Build Gradle
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.1.4' }
          android {
              namespace 'com.mxq.islami.launcher.v2'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.mxq.islami.launcher.v2'
                  minSdk 21
                  targetSdk 22
                  versionCode 2
                  versionName '2.0-FINAL'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
          EOF

          # 2. Manifest - KUNCI JADI LAUNCHER
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <application android:label="Islami Launcher" android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity android:name=".MainActivity" android:launchMode="singleTask" android:screenOrientation="landscape" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <receiver android:name=".BootReceiver" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.BOOT_COMPLETED" /></intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          # 3. MainActivity (Isi yang lama abang biarin, kalo mau pakai yang baru)
          cat > app/src/main/java/com/mxq/islami/launcher/v2/MainActivity.java <<'EOF'
          package com.mxq.islami.launcher.v2;
          import android.app.Activity;
          import android.os.Bundle;
          import android.widget.TextView;
          import android.view.Gravity;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;
          public class MainActivity extends Activity {
              @Override protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  TextView tv = new TextView(this);
                  tv.setTextSize(24);
                  tv.setGravity(Gravity.CENTER);
                  String jam = new SimpleDateFormat("HH:mm:ss", Locale.getDefault()).format(new Date());
                  tv.setText(jam + "\n\nMinggu, 02 Nov 2026\n\nSubuh 04:50 | Dzuhur 11:52 | Ashar 15:10 | Maghrib 17:52 | Isya 19:05\n\n[ISLAMI LAUNCHER V2 - AUTO START]");
                  setContentView(tv);
              }
              @Override public void onBackPressed() {} // Biar gak bisa keluar pake back
          }
          EOF

          # 4. BootReceiver - KUNCI AUTO START
          cat > app/src/main/java/com/mxq/islami/launcher/v2/BootReceiver.java <<'EOF'
          package com.mxq.islami.launcher.v2;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          public class BootReceiver extends BroadcastReceiver {
              @Override public void onReceive(Context c, Intent intent) {
                  if (Intent.ACTION_BOOT_COMPLETED.equals(intent.getAction())) {
                      Intent i = new Intent(c, MainActivity.class);
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      c.startActivity(i);
                  }
              }
          }
          EOF

          # 5. Settings Gradle
          cat > settings.gradle <<'EOF'
          include ':app'
          EOF

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MXQ-Pro-Islami-FINAL
          path: app/build/outputs/apk/debug/app-debug.apk
